<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Voce · Segretario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#eae6f2;--dim:rgba(234,230,242,.55);--faint:rgba(234,230,242,.28);--line:rgba(234,230,242,.14);
 --acc:#52ff6a;--acc2:#ff2a8f;--amber:#ffb23d;--pad:clamp(14px,2.4vw,28px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#000;overflow:hidden}
#voce-root{position:fixed;inset:0;background:#000;color:var(--ink);font:13px/1.45 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;
 -webkit-font-smoothing:antialiased;user-select:none;z-index:2147483000}
#voce-root[hidden]{display:none}
#voce-root *,#voce-root *::before,#voce-root *::after{box-sizing:border-box}
/* il tasto per tornare alla chat normale (solo quando la Voce vive sopra claude.ai) */
#voce-root .chatnorm{display:none;appearance:none;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--dim);padding:9px 12px;border-radius:2px;
 font:400 10px/1 "Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-left:10px}
#voce-root[data-host=claude] .chatnorm{display:inline-block}
#voce-root .chatnorm:hover{color:var(--ink)}
#voce-root[data-look=rosso]{--acc:#ff3a86;--acc2:#ffd2ea}#voce-root[data-look=tramonto]{--acc:#ffa23a;--acc2:#ffe9c9}#voce-root[data-fase=parlo]{--acc:var(--acc2)}#voce-root[data-fase=penso],#voce-root[data-fase=trascrivo]{--acc:var(--amber)}#voce-root[data-muto="1"]{--acc:#ff3b3b}
#scena{position:fixed;inset:0;width:100%;height:100%;display:block}
/* lo strato "vetro" sopra la scena: linee di mira, pannelli, testo */
.hud{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:var(--pad);pointer-events:none;
 text-shadow:0 0 6px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.6)}
.hud>*{pointer-events:auto}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.cap{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
/* testata */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand b{font-family:"Space Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.26em;color:var(--ink)}
.brand b i{font-style:normal;color:var(--acc);text-shadow:0 0 10px var(--acc)}
.clock{text-align:right}
.clock b{display:block;font:700 26px/1 "Space Mono",monospace;letter-spacing:.06em}
.clock span{display:block;margin-top:4px}
/* i due pannelli ai lati: la giornata */
.mid{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr) minmax(200px,300px);align-items:end;gap:var(--pad);min-height:0}
.pan{display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:hidden;mask-image:linear-gradient(#000 85%,transparent)}
.pan.r{text-align:right}
.blk h3{margin:0 0 6px;font:400 10px/1 "Space Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 8px var(--acc)}
.blk h3::before{content:"";display:inline-block;width:18px;height:1px;background:var(--acc);margin-right:8px;vertical-align:middle;box-shadow:0 0 6px var(--acc)}
.pan.r .blk h3::before{display:none}.pan.r .blk h3::after{content:"";display:inline-block;width:18px;height:1px;background:var(--acc);margin-left:8px;vertical-align:middle;box-shadow:0 0 6px var(--acc)}
.blk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.blk li{color:var(--ink);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk li .k{color:var(--dim);margin-right:8px;font-family:"Space Mono",monospace;font-size:11px}
.blk li.vuoto,.blk li.nl{color:var(--faint);font-style:italic}
.blk li.att{color:var(--amber)}
/* centro: sottotitoli */
.centro{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;min-height:0;min-width:0;padding-bottom:4vh}
#righe{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(680px,100%);text-align:center}
.riga{margin:0;font-size:15px;line-height:1.4;color:var(--ink);max-width:100%;animation:up .35s ease both}
.riga .chi{display:block;font:400 9px/1 "Space Mono",monospace;letter-spacing:.3em;color:var(--dim);margin-bottom:4px}
.riga.seg .t{font-size:17px;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35),0 0 24px rgba(0,0,0,.9)}
.riga.seg .chi{color:var(--acc)}
.riga.ema .t{color:var(--dim)}
.riga.prov .t{color:var(--ink);opacity:.85}
.riga.err .t{color:#ff6b6b}.riga.piano .t{color:var(--faint)}.riga.vecchia{opacity:.45}
.riga .fr{transition:color .3s,text-shadow .3s}
.riga .fr.ora{color:#fff;text-shadow:0 0 12px var(--acc),0 0 24px rgba(0,0,0,.9)}
.riga em{font-style:normal;color:var(--acc);text-shadow:0 0 10px var(--acc)}
.riga .fr.forte em{color:#fff}
/* ---- MODO TESTO: si legge. Colonna di lettura su un vetro scuro, carattere proporzionale, scena attenuata ---- */
#voce-root[data-modo=testo] #scena{filter:brightness(.8) saturate(.9)}
#voce-root[data-modo=testo] .mid{grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(220px,300px)}
#voce-root[data-modo=testo] .centro{justify-content:flex-end;align-items:stretch;padding-bottom:0}
#voce-root[data-modo=testo] #righe{max-width:none;width:100%;height:auto;max-height:min(46vh,100%);overflow-y:auto;overscroll-behavior:contain;align-items:stretch;text-align:left;gap:14px;
 padding:20px 24px;background:rgba(6,4,10,.78);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(14px);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#voce-root[data-modo=testo] .riga{font:400 17px/1.55 "IBM Plex Sans",system-ui,sans-serif;animation:none;text-shadow:none;max-width:70ch;user-select:text}
#voce-root[data-modo=testo] .riga .chi{font-size:10px;margin-bottom:5px}
#voce-root[data-modo=testo] .riga.seg .t{font-size:18px;color:#f6f3fb;text-shadow:none}
#voce-root[data-modo=testo] .riga.ema{align-self:flex-end;text-align:right}
#voce-root[data-modo=testo] .riga.ema .t{color:#cfcad8}
#voce-root[data-modo=testo] .riga em{color:var(--acc);font-weight:600;text-shadow:none}
#voce-root[data-modo=testo] .riga.vecchia{opacity:.7}
#voce-root[data-modo=testo] .pan{font-size:13px;background:rgba(6,4,10,.62);padding:14px 16px;border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(10px);mask-image:none;text-shadow:none}
#voce-root[data-modo=testo] .blk li{font:400 13.5px/1.4 "IBM Plex Sans",system-ui,sans-serif;white-space:normal;color:#eae6f2}
#voce-root[data-modo=testo] .blk li .k{font-size:11px;color:var(--dim)}
#voce-root[data-modo=testo] #scrivi{width:min(420px,100%);font:400 15px/1.3 "IBM Plex Sans",system-ui,sans-serif;background:rgba(6,4,10,.6);padding:10px 12px;border:1px solid var(--line);border-radius:4px}
#voce-root[data-modo=testo] .modi button,#voce-root[data-modo=testo] #zitto{background:rgba(6,4,10,.75)}
/* la voce: sottotitoli comunque leggibili, su un velo */
#voce-root:not([data-modo=testo]) #righe{max-height:42vh;overflow-y:auto;scrollbar-width:none;box-sizing:border-box;padding:10px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,transparent);border-radius:8px}
#voce-root:not([data-modo=testo]) .riga.seg .t{font-size:19px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:500}
#voce-root:not([data-modo=testo]) .riga.ema .t{font-size:14px}
.pan,.blk li{text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.8)}
/* in voce: un velo scuro dietro i pannelli, così si leggono anche sul pavimento acceso */
#voce-root:not([data-modo=testo]) .pan{padding:12px 14px;border-radius:6px;background:radial-gradient(120% 100% at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,.25) 70%,transparent)}
#voce-root:not([data-modo=testo]) .pan.r{background:radial-gradient(120% 100% at 100% 100%,rgba(0,0,0,.62),rgba(0,0,0,.25) 70%,transparent)}
.blk li{font-size:13px}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* fondo: comandi */
.bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:var(--pad)}
.modi{display:flex;gap:6px}
.modi button,#zitto{appearance:none;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--dim);padding:9px 12px;border-radius:2px;
 font:400 10px/1 "Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
#lingua{min-width:40px}
#hal[aria-pressed=true]{color:#ff3b3b;border-color:#ff3b3b;box-shadow:0 0 12px -2px #ff3b3b}
#hal.carica{animation:halpulse 1s ease-in-out infinite}
@keyframes halpulse{50%{opacity:.4}}
.modi button[aria-pressed=true]{color:var(--acc);border-color:var(--acc);box-shadow:0 0 12px -2px var(--acc),inset 0 0 12px -8px var(--acc)}
.modi button:hover,#zitto:hover{color:var(--ink)}
#voce-root[data-muto="1"] #zitto{color:#ff3b3b;border-color:#ff3b3b;box-shadow:0 0 12px -2px #ff3b3b}
.cmd{display:flex;flex-direction:column;align-items:center;gap:10px}
#parla{appearance:none;width:92px;height:92px;border-radius:50%;border:1px solid var(--acc);background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.2),rgba(0,0,0,.8));
 color:var(--acc);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 24px -6px var(--acc),inset 0 0 24px -14px var(--acc);
 transition:box-shadow .25s,transform .12s;touch-action:none;position:relative}
#parla::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed var(--acc);opacity:.35;animation:spin 14s linear infinite}
#parla:active,#parla[aria-pressed=true]{transform:scale(.96);box-shadow:0 0 40px -4px var(--acc),inset 0 0 30px -10px var(--acc)}
#parla svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--acc))}
@keyframes spin{to{transform:rotate(360deg)}}
.l{font:400 10px/1 "Space Mono",monospace;letter-spacing:.24em;color:var(--acc);text-transform:uppercase;min-height:10px;text-shadow:0 0 8px var(--acc)}
.dx{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#scrivi{appearance:none;width:min(300px,100%);border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 0;outline:0;
 font:400 13px/1.3 "IBM Plex Mono",monospace;text-align:right}
#scrivi::placeholder{color:var(--faint)}#scrivi:focus{border-color:var(--acc)}
.sys{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sys span{font:400 9px/1 "Space Mono",monospace;letter-spacing:.18em;color:var(--faint);display:inline-flex;align-items:center;gap:5px}
.sys span::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.sys span.on{color:var(--acc)}.sys span.off{color:#ff5050}
/* mirino: quattro angoli e la linea dell'orizzonte in sovraimpressione, come un viewfinder */
.ang{position:fixed;width:22px;height:22px;border:1px solid var(--faint);pointer-events:none}
.ang.a{top:10px;left:10px;border-right:0;border-bottom:0}.ang.b{top:10px;right:10px;border-left:0;border-bottom:0}
.ang.c{bottom:10px;left:10px;border-right:0;border-top:0}.ang.d{bottom:10px;right:10px;border-left:0;border-top:0}
@media (max-width:900px){
 .mid{grid-template-columns:1fr;align-items:start}
 #voce-root[data-modo=testo] .mid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;align-items:stretch;min-height:0}
 #voce-root[data-modo=testo] .pan{max-height:20vh;order:2}#voce-root[data-modo=testo] .centro{order:1;min-height:0}
 #voce-root[data-modo=testo] #righe{height:auto;max-height:100%;padding:14px 16px}
 #voce-root[data-modo=testo] .riga{font-size:15.5px}#voce-root[data-modo=testo] .riga.seg .t{font-size:16.5px}
 #voce-root:not([data-modo=testo]) #b-tempo,#voce-root:not([data-modo=testo]) #b-lav{display:none!important}
 #voce-root:not([data-modo=testo]) .pan{max-height:30vh}
 .pan.r{display:none}.pan{max-height:34vh;font-size:12px}
 .bot{grid-template-columns:1fr;justify-items:center;gap:12px}.dx{align-items:center}.sys{justify-content:center}
 .clock b{font-size:20px}.riga{font-size:14px}.riga.seg .t{font-size:16px}
}
/* il tasto del microfono: uno stato, un colore, un'animazione. Spento = grigio e fermo. */
#voce-root{--st:#7d778a}
#voce-root[data-st=ascolto]{--st:#ff3b3b}#voce-root[data-st=penso]{--st:var(--amber)}#voce-root[data-st=parlo]{--st:#5cff8a}#voce-root[data-st=spento]{--st:#6a6570}
#voce-root .tasto{display:flex;align-items:center;gap:14px}
#voce-root .barre{display:flex;align-items:center;gap:3px;width:92px;height:46px;opacity:.25;transition:opacity .25s}
#voce-root .barre i{flex:1;height:100%;border-radius:2px;background:var(--st);transform:scaleY(.05);box-shadow:0 0 8px -1px var(--st);transition:background .25s}
#voce-root[data-st=ascolto] .barre,#voce-root[data-st=parlo] .barre{opacity:1}
#voce-root #parla{border-color:var(--st);color:var(--st);box-shadow:none;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.85));transition:box-shadow .2s,transform .12s,border-color .25s,color .25s}
#voce-root #parla::before{border-color:var(--st);opacity:.22;animation:none}
#voce-root #parla::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--st);opacity:0;pointer-events:none}
#voce-root #parla svg{filter:none;display:none}
#voce-root[data-ic=mic] #parla .i-mic,#voce-root[data-ic=stop] #parla .i-stop,#voce-root[data-ic=off] #parla .i-off{display:block}
#voce-root #parla .i-stop{fill:currentColor;stroke:none}
#voce-root[data-st=riposo] #parla:hover,#voce-root[data-st=spento] #parla:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 18px -6px var(--acc)}
#voce-root[data-st=ascolto] #parla{background:radial-gradient(circle at 50% 42%,#ff6464,#b3121f 72%);color:#fff;border-color:#ff9a9a;
 box-shadow:0 0 calc(24px + var(--liv,0)*46px) -2px #ff3b3b,inset 0 0 22px -8px rgba(255,255,255,.8);transform:scale(calc(1 + var(--liv,0)*.07))}
#voce-root[data-st=ascolto] #parla::after{animation:vanello 1.4s ease-out infinite}
#voce-root[data-st=ascolto] #parla::before{border-style:solid;animation:vanello 1.4s ease-out .7s infinite}
@keyframes vanello{from{transform:scale(1);opacity:.75}to{transform:scale(1.6);opacity:0}}
#voce-root[data-st=penso] #parla{box-shadow:0 0 26px -6px var(--st),inset 0 0 22px -12px var(--st)}
#voce-root[data-st=penso] #parla::before{opacity:.95;border-width:2px;animation:spin 1.5s linear infinite}
#voce-root[data-st=parlo] #parla{box-shadow:0 0 calc(20px + var(--liv,0)*42px) -4px var(--st),inset 0 0 26px -10px var(--st)}
/* la striscia di stato: scorre da una scritta all'altra e prende il colore dello stato */
#voce-root .l{height:16px;overflow:hidden;min-width:320px;text-align:center;font-size:11px;line-height:16px;color:var(--st);text-shadow:0 0 8px var(--st);transition:color .3s}
#voce-root .nastro{display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.9,.2,1)}
#voce-root .nastro span{display:block;height:16px;white-space:nowrap}
#voce-root[data-st=ascolto] .nastro{transform:translateY(-16px)}#voce-root[data-st=penso] .nastro{transform:translateY(-32px)}
#voce-root[data-st=parlo] .nastro{transform:translateY(-48px)}#voce-root[data-st=spento] .nastro{transform:translateY(-64px)}
#voce-root[data-st=ascolto] .l{font-weight:700}
#voce-root .nastro .rec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;margin-right:9px;box-shadow:0 0 8px #ff3b3b;animation:halpulse 1s ease-in-out infinite}
/* HAL: la barra di caricamento sul tasto */
#voce-root #hal{position:relative;overflow:hidden}
#voce-root #hal::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;transition:width .9s linear}
#voce-root #hal.carica{animation:none;color:#ff8f8f;border-color:#ff3b3b}
#voce-root #hal.pausa{color:var(--amber);border-color:var(--amber);box-shadow:0 0 10px -3px var(--amber)}
#voce-root #halspegni{min-width:0;padding:9px 10px;font-size:13px;line-height:10px;color:#ff6b6b;border-color:rgba(255,80,80,.55)}
#voce-root #halspegni:hover{color:#fff;border-color:#ff3b3b;box-shadow:0 0 12px -2px #ff3b3b}
#voce-root #halspegni[hidden],#voce-root #halvel[hidden]{display:none}
#voce-root #halvel{min-width:0;padding:9px 9px;letter-spacing:.06em;text-transform:none}
/* quanto è occupata la scheda video */
#voce-root .gpu{display:flex;align-items:center;gap:8px;font:400 10px/1 "Space Mono",monospace;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
#voce-root .gpu[hidden]{display:none}
#voce-root .gpu b{font-weight:700;color:var(--ink);min-width:4ch;text-align:right}
#voce-root .gpu .gb{display:block;width:70px;height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#voce-root .gpu .gb u{display:block;height:100%;width:calc(var(--g,0)*100%);background:var(--acc);transition:width .6s,background .3s}
#voce-root .gpu.caldo,#voce-root .gpu.caldo b{color:#ff3b3b}#voce-root .gpu.caldo .gb u{background:#ff3b3b}
@media (max-width:900px){#voce-root .l{min-width:0}#voce-root .barre{width:64px}}
@media (prefers-reduced-motion:reduce){#voce-root #parla::after,#voce-root #parla::before,#voce-root .nastro .rec::before{animation:none}#voce-root .nastro{transition:none}}
@media (prefers-reduced-motion:reduce){#parla::before{animation:none}.riga{animation:none}}
</style>
</head>
<body>
<div id="voce-root" data-fase="riposo" data-modo="voce" data-look="verde">
<canvas id="scena" aria-hidden="true"></canvas>
<i class="ang a"></i><i class="ang b"></i><i class="ang c"></i><i class="ang d"></i>
<div class="hud">
  <header class="top">
    <div class="brand"><b>SEGRETARI<i>O</i></b><span class="cap" id="sotto">voce · canale privato</span></div>
    <div class="clock"><b id="ora">--:--</b><span class="cap" id="data"></span></div>
  </header>
  <section class="mid">
    <div class="pan l">
      <div class="blk" id="b-cal"><h3>Calendario</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-oggi"><h3>Oggi</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-tempo"><h3>Se hai tempo</h3><ul></ul></div>
    </div>
    <div class="centro"><div id="righe" aria-live="polite"></div></div>
    <div class="pan r">
      <div class="blk" id="b-att"><h3>Claude aspetta te</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-lav"><h3>Al lavoro</h3><ul></ul></div>
      <div class="blk" id="b-mail"><h3>Email da leggere</h3><ul></ul></div>
    </div>
  </section>
  <footer class="bot">
    <div class="modi" role="group" aria-label="Modo">
      <button type="button" data-m="testo" aria-pressed="false">Voce → testo</button>
      <button type="button" data-m="voce" aria-pressed="true">Voce → voce</button>

<script nonce="{{NONCE}}">
/* I pannelli: la giornata di Ema da voce.json, ogni minuto. Orologio ogni secondo. */
(() => {
"use strict";
const ROOT = document.getElementById("voce-root");
const $ = (s) => ROOT.querySelector(s);
const G = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"], M = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function orologio(){ const d=new Date(); $("#ora").textContent=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  $("#data").textContent=`${G[d.getDay()]} ${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}`; }
orologio(); setInterval(orologio, 1000);
if (window.VOCE_VERSIONE) $("#sotto").textContent = "voce · " + window.VOCE_VERSIONE;
function lista(id, voci, vuoto, f){
  const ul=$(id+" ul"); ul.textContent="";
  if(voci===null||voci===undefined){ const li=document.createElement("li"); li.className="nl"; li.textContent="non letto"; ul.append(li); return; }
  if(!voci.length){ const li=document.createElement("li"); li.className="vuoto"; li.textContent=vuoto; ul.append(li); return; }
  voci.forEach((v)=>{ const li=document.createElement("li"); const r=f(v); if(r.k){const k=document.createElement("span");k.className="k";k.textContent=r.k;li.append(k);} li.append(r.t); if(r.cls) li.className=r.cls; li.title=r.t; ul.append(li); });
}
async function pannelli(){
  try{
    const url = (window.VoceConfig && window.VoceConfig.pannelli) || "voce.json";
    let d;
    if (window.VoceConfig && typeof window.VoceConfig.leggiPannelli === "function") { d = await window.VoceConfig.leggiPannelli(url); if (!d) return; }
    else { const r=await fetch(url,{credentials:"include"}); if(!r.ok) return; d=await r.json(); }
    lista("#b-cal", d.eventi, "niente in programma", (e)=>({k:e.ora?(e.ora+(e.fine?"–"+e.fine:"")):"tutto il giorno", t:e.titolo+(e.luogo?" · "+e.luogo:"")}));
    lista("#b-oggi", d.oggi, "niente di fissato", (t)=>({t}));
    lista("#b-tempo", d.se_hai_tempo||[], "", (t)=>({t}));
    $("#b-tempo").style.display = (d.se_hai_tempo||[]).length ? "" : "none";
    lista("#b-att", d.aspettano, "nessuno", (s)=>({k:s.nome, t:s.domanda, cls:"att"}));
    lista("#b-lav", d.lavorano||[], "", (s)=>({k:s.da, t:s.nome}));
    $("#b-lav").style.display = (d.lavorano||[]).length ? "" : "none";
    lista("#b-mail", d.email, "nessuna", (m)=>({k:m.da.split(/[<@]/)[0].trim().slice(0,18), t:m.oggetto}));
    $("#b-mail").style.display = d.email===null ? "none" : "";
    const s=d.sistemi||{}; const nomi={memoria:"memoria",telegram:"telegram",keep:"keep",calendario:"calendario",whatsapp:"whatsapp",orecchie:"orecchie",voce:"voce"};
    const box=$("#sys"); box.textContent="";
    Object.keys(nomi).forEach((k)=>{ const sp=document.createElement("span"); sp.className=s[k]?"on":"off"; sp.textContent=nomi[k]; box.append(sp); });
    $("#sotto").textContent = (d.proposte_in_attesa ? `${d.proposte_in_attesa} regole da approvare` : "canale privato") + " · " + (window.VOCE_VERSIONE || "pagina");
  }catch(_){}
}
pannelli(); setInterval(pannelli, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pannelli(); });
})();
</script>
