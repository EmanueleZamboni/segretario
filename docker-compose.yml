# Segretario: la memoria condivisa per Claude. Un container sulla rete del Caddy di Postino, che lo
# raggiunge come "segretario:8766" (handle_path /segretario/* nel Caddyfile di Postino).
# Nessuna porta pubblicata. I dati (memoria git, segreto, URL del connettore) stanno nel volume.
#   URL del connettore:   docker compose exec segretario cat /data/connector-url
#   storia della memoria: docker compose exec segretario git -C /data/memoria log --oneline
services:
  segretario:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - SEGRETARIO_PUBLIC_HOST=${SEGRETARIO_PUBLIC_HOST:-postino.emazamboni.com}
      - SEGRETARIO_PUBLIC_PREFIX=/segretario
      - SEGRETARIO_SECRET=${SEGRETARIO_SECRET:-}
      # Login (OAuth) sul connettore: 1 = acceso. 0 solo per emergenza (torna il solo segreto nell'indirizzo).
      - SEGRETARIO_OAUTH=${SEGRETARIO_OAUTH:-1}
      # Token SOLO per la trascrizione chiesta dal container WhatsApp (lo genera install.sh)
      - TRASCRIVI_TOKEN=${TRASCRIVI_TOKEN:-}
      # Reti in più da trattare come Anthropic, se un giorno Anthropic ne aggiunge (separate da virgola)
      - SEGRETARIO_IP_FIDATI=${SEGRETARIO_IP_FIDATI:-}
      # Solo per mostrare nel manager il link della pagina WhatsApp (il servizio è whatsapp/)
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
      # Keep letto dal server per il brief del mattino (li scrive ops/run.sh di Various nel .env)
      - KEEP_MCP_URL=${KEEP_MCP_URL:-}
      - KEEP_MCP_HOST=${KEEP_MCP_HOST:-}
      # Email importanti nel brief: il database di Postino, montato in sola lettura (vuoto = niente email)
      - POSTINO_DB=${POSTINO_DB:-}
      - MEMORIA_GIT_REMOTE=${MEMORIA_GIT_REMOTE:-}
      # Consegna al telefono (opzionali: senza, il Segretario funziona lo stesso, senza notify)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFY_DAILY_CAP=${NOTIFY_DAILY_CAP:-60}
      # Vocali Telegram -> testo (Groq prima, OpenAI come riserva)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Messaggi di Ema -> task cloud "Segretario on demand" (URL /fire e token dal dialogo del task)
      - ROUTINE_FIRE_URL=${ROUTINE_FIRE_URL:-}
      - ROUTINE_FIRE_TOKEN=${ROUTINE_FIRE_TOKEN:-}
    volumes:
      - segretario_data:/data
      - ${POSTINO_DATA_DIR:-/nonexistent}:/postino:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8766"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # WhatsApp del Segretario (cartella whatsapp/): connettore MCP + pagina /stato per collegare il telefono.
  # Caddy manda /whatsapp/* a whatsapp:8787 togliendo il prefisso. Nessuna porta pubblicata.
  #   pagina di stato / QR:  https://<host>/whatsapp/mcp/<WHATSAPP_TOKEN>/stato
  #   connettore Claude:     https://<host>/whatsapp/mcp/<WHATSAPP_TOKEN>   (in CONNECTOR_URL.txt)
  whatsapp:
    build: ./whatsapp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - MCP_TOKEN=${WHATSAPP_TOKEN:-}
      # Vocali WhatsApp -> testo tramite il Segretario, con un token che serve SOLO a quello (non il segreto)
      - SEGRETARIO_URL=http://segretario:8766/t/${TRASCRIVI_TOKEN:-spento}
      - TZ=Europe/Rome
    volumes:
      - whatsapp_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8787"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

# La rete di Caddy (progetto compose "postino" => "postino_default"). install.sh la rileva e la scrive in .env.
networks:
  default:
    name: ${CADDY_NETWORK:-postino_default}
    external: true

volumes:
  segretario_data:
  whatsapp_data:
