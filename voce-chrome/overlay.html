<div id="voce-root" data-fase="riposo" data-modo="voce" data-look="verde" data-host="claude">
<canvas id="scena" aria-hidden="true"></canvas>
<i class="ang a"></i><i class="ang b"></i><i class="ang c"></i><i class="ang d"></i>
<div class="hud">
  <header class="top">
    <div class="brand"><b>SEGRETARI<i>O</i></b><span class="cap" id="sotto">voce · canale privato</span></div>
    <div class="clock"><b id="ora">--:--</b><span class="cap" id="data"></span></div>
  </header>
  <section class="mid">
    <div class="pan l">
      <div class="blk" id="b-cal"><h3>Calendario</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-oggi"><h3>Oggi</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-tempo"><h3>Se hai tempo</h3><ul></ul></div>
    </div>
    <div class="centro"><div id="righe" aria-live="polite"></div></div>
    <div class="pan r">
      <div class="blk" id="b-att"><h3>Claude aspetta te</h3><ul><li class="nl">…</li></ul></div>
      <div class="blk" id="b-lav"><h3>Al lavoro</h3><ul></ul></div>
      <div class="blk" id="b-mail"><h3>Email da leggere</h3><ul></ul></div>
    </div>
  </section>
  <footer class="bot">
    <div class="modi" role="group" aria-label="Modo">
      <button type="button" data-m="testo" aria-pressed="false">Voce → testo</button>
      <button type="button" data-m="voce" aria-pressed="true">Voce → voce</button>
      <button type="button" data-m="live" aria-pressed="false" title="Conversazione con la voce di Claude">Live</button>
      <button type="button" class="chatnorm" id="chatnorm" title="Nascondi la Voce e usa la chat normale">Chat normale</button>
      <button type="button" id="lingua" title="Lingua in cui parli al microfono">MIC IT</button>
      <button type="button" id="hal" title="Voce HAL: un clic la accende, poi la mette in pausa (parla Claude) e la riprende subito" aria-pressed="false">HAL OFF</button>
      <button type="button" id="halvel" title="Velocità della voce HAL: un clic per cambiarla" hidden>1.5×</button>
      <button type="button" id="halspegni" title="Spegni HAL del tutto: libera memoria e scheda video (riaccenderlo richiede circa 20 secondi)" aria-label="Spegni HAL del tutto" hidden>⏻</button>
    </div>
    <div class="cmd">
      <div class="tasto">
        <div class="barre sx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button id="parla" type="button" aria-label="Parla" aria-pressed="false">
          <svg class="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
          <svg class="i-off" viewBox="0 0 24 24"><line x1="3" x2="21" y1="3" y2="21"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M19 10v2a7 7 0 0 1-.6 2.8M5 10v2a7 7 0 0 0 11 5.7"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
        <div class="barre dd" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="l" aria-live="polite"><div class="nastro"><span data-k="riposo"></span><span data-k="ascolto" class="rec"></span><span data-k="penso"></span><span data-k="parlo"></span><span data-k="spento"></span></div></div>
    </div>
    <div class="dx">
      <input id="scrivi" type="text" placeholder="oppure scrivi e premi Invio" autocomplete="off" spellcheck="false">
      <div class="gpu" id="gpu" hidden title="Quanto è occupata la scheda video del PC: se è rossa, un altro programma la sta usando e HAL va a rilento"><span>GPU</span><b id="gpu-n">--%</b><i class="gb"><u></u></i><span id="gpu-m"></span></div>
      <div class="sys" id="sys"></div>
      <button id="zitto" type="button" title="Zitto finché non ti chiamo per nome">Silenzio</button>
    </div>
  </footer>
</div>
</div>
